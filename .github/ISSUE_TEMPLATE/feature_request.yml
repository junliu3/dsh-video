name: Feature request
description: Suggest a capability, a new site, or a better output format
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: Describe the workflow, not just the missing button.
      placeholder: I have 30 Douyin links a week and want them queued in one go.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
      placeholder: A `video_batch` tool that accepts a list and reports per-item status.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Download / site support
        - Transcription / models
        - Document output
        - DSH tool surface / jobs
        - Installation / packaging
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and syntax checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test-only dependencies
        run: pip install -r python/requirements-dev.txt

      - name: Byte-compile the engine
        run: python -m compileall -q python/ytdip tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax-check the plugin layer
        run: |
          for file in lib/*.js scripts/*.mjs; do
            echo "checking $file"
            node --check "$file"
          done

      - name: Verify manifest wiring
        run: node scripts/check-manifest.mjs
